name: Install gate

# Proves that `/dpm get <slug>` on a fresh server installs a plugin's current stable release
# and that the installed plugin enables — the acceptance test for a stable release, run
# through the same path an operator uses. See gates/dpm_install.py for the assertions.
#
# Callable two ways with the same inputs: `workflow_dispatch` (the fleet's release
# automation, or a person, dispatches it with a list of DPM slugs) and `workflow_call`.
# Both record `result.json` and the server log as run artifacts.
#
# The OMCSI checkout + Docker image cache is the pattern from boot-gate.yml (lifted from
# Dans-Plugin-Manager's .github/workflows/integration.yml): on a cache hit the 10–15 minute
# Spigot build is skipped.

on:
  # TEMPORARY: registers the workflow on this branch so it can be dispatched before merge.
  push:
    branches: [dpm-install]
  workflow_dispatch:
    inputs:
      plugins:
        description: "Comma-separated DPM plugin slugs to install (e.g. easylinks,herald)"
        required: true
        type: string
      minecraft_version:
        description: "Spigot version to boot"
        required: false
        type: string
        default: "26.2"
  workflow_call:
    inputs:
      plugins:
        required: true
        type: string
      minecraft_version:
        required: false
        type: string
        default: "26.2"

permissions:
  contents: read

concurrency:
  group: dpm-install-${{ inputs.plugins }}-${{ inputs.minecraft_version }}
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name != 'push'
    name: dpm get ${{ inputs.plugins }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout gates
        uses: actions/checkout@v4

      - name: Checkout OMCSI
        uses: actions/checkout@v4
        with:
          repository: dmccoystephenson/open-mc-server-infrastructure
          path: omcsi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: pip install requests pyyaml

      # The manager itself comes from its current *stable* release — the same jar an
      # operator downloads. `original-*.jar` is the Maven shade plugin's unshaded artifact
      # and is never the plugin.
      - name: Download Dan's Plugin Manager (stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/dpm
          url=$(gh api "repos/Dans-Plugins/Dans-Plugin-Manager/releases/latest" \
            -q '[.assets[] | select(.name | endswith(".jar")) | select(.name | startswith("original-") | not)][0].browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Dans-Plugin-Manager has no stable release with a jar asset" >&2
            exit 1
          fi
          name=$(basename "$url")
          curl -fsSL -o "work/dpm/$name" "$url"
          unzip -l "work/dpm/$name" plugin.yml >/dev/null
          echo "Dans-Plugins/Dans-Plugin-Manager -> $name"
          echo "DPM_JAR=$PWD/work/dpm/$name" >> "$GITHUB_ENV"

      - name: Configure OMCSI environment
        run: |
          {
            echo "MINECRAFT_VERSION=${{ inputs.minecraft_version }}"
            echo "OPERATOR_UUID=00000000-0000-0000-0000-000000000001"
            echo "OPERATOR_NAME=CIRunner"
            echo "OPERATOR_LEVEL=4"
            echo "ONLINE_MODE=false"
            echo "OVERWRITE_EXISTING_SERVER=true"
            echo "SERVER_MOTD=Install gate"
            echo "MAX_PLAYERS=5"
            echo "DIFFICULTY=peaceful"
            echo "GAMEMODE=creative"
            echo "PVP_ENABLED=false"
            echo "JAVA_OPTS=-Xmx2G -Xms1G"
            echo "MINECRAFT_AUTO_RESTART=false"
            echo "DEPLOY_AUTH_TOKEN=dpm-install-$GITHUB_RUN_ID"
            echo "RCON_PASSWORD=dpm-install-$GITHUB_RUN_ID"
            echo "DISCORD_ENABLED=false"
            echo "DISCORD_WEBHOOK_URL="
            echo "ALERT_MANAGER_ENABLED=false"
            echo "AGENT_ENABLED=false"
          } > omsci.env.tmp
          mv omsci.env.tmp omcsi/.env

      - name: Cache OMCSI Docker images
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/omcsi-images.tar
          key: omcsi-docker-${{ inputs.minecraft_version }}-${{ hashFiles('omcsi/**/Dockerfile', 'omcsi/compose.yml') }}
          restore-keys: omcsi-docker-${{ inputs.minecraft_version }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/omcsi-images.tar

      - name: Build OMCSI services
        if: steps.docker-cache.outputs.cache-hit != 'true'
        working-directory: omcsi
        env:
          DOCKER_BUILDKIT: '1'
          BUILDKIT_PROGRESS: plain
        run: docker compose build minecraft-wrapper alert-manager

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save open-mc-server open-mc-server-alert-manager > /tmp/omcsi-images.tar

      - name: Start minecraft-wrapper
        working-directory: omcsi
        run: docker compose up -d ${{ steps.docker-cache.outputs.cache-hit == 'true' && '--no-build' || '' }} minecraft-wrapper

      - name: Run the install gate
        env:
          OMCSI_API_BASE: http://localhost:8092
          OMCSI_DEPLOY_TOKEN: dpm-install-${{ github.run_id }}
          PLUGINS: ${{ inputs.plugins }}
          JARS_DIR: ${{ github.workspace }}/work/jars
          RESULT_PATH: ${{ github.workspace }}/work/result.json
        run: python gates/dpm_install.py

      - name: Collect server log
        if: always()
        run: |
          mkdir -p work/evidence
          docker logs open-mc-server > work/evidence/server.log 2>&1 || true

      - name: Summarize
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "work/result.json"
          if not os.path.exists(p):
              print("## Install gate — no result written (harness did not run)"); raise SystemExit
          r = json.load(open(p))
          print(f"## Install gate — {'PASSED' if r['passed'] else 'FAILED'}")
          print(f"{r['dpm']} (enabled v{r.get('dpmVersion')})\n")
          print("| slug | plugin | version | installed | enabled |\n|---|---|---|---|---|")
          for p in r["plugins"]:
              print(f"| {p['slug']} | {p.get('name') or ''} | {p.get('version') or ''} | {'✅' if p['installed'] else '❌'} | {'✅' if p['enabled'] else '❌'} |")
          print("\n| assertion | result | detail |\n|---|---|---|")
          for a in r["assertions"]:
              print(f"| {a['name']} | {'✅' if a['passed'] else '❌'} | {a['detail']} |")
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpm-install-${{ github.run_id }}
          path: |
            work/result.json
            work/evidence/
          if-no-files-found: warn

      - name: Tear down OMCSI stack
        if: always()
        working-directory: omcsi
        run: docker compose down
