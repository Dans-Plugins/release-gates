name: Save-compatibility gate

# T2-lite: proves a candidate plugin jar loads the data the current stable release wrote,
# migrates it, and keeps it across its own restart. The stable jar is booted first (with
# optional config overrides and console commands to give it something to save), its data
# folder is captured as a fixture, and the candidate is then booted over that data twice.
# See gates/save_compat.py for the assertions.
#
# With `fixture_url` nothing is recorded: the fixture (a plugin-fixtures release asset,
# with its `manifest.json` beside it) is unpacked into the server root before the
# baseline's first boot, the baseline is booted over it — proving the fixture loads on the
# stable and fixing the reference counts, which must also equal the manifest's `expected`
# — and the candidate follows exactly as otherwise.
#
# Callable two ways with the same inputs: `workflow_dispatch` (the fleet's release
# automation, or a person, dispatches it with the two jar URLs) and `workflow_call` (a
# plugin repository's own workflow can reuse it). Both record `result.json`, the server
# log, the fixture and the candidate's data as run artifacts.
#
# The OMCSI checkout + Docker image cache is the pattern from boot-gate.yml (lifted from
# Dans-Plugin-Manager's .github/workflows/integration.yml): on a cache hit the 10–15 minute
# Spigot build is skipped.

on:
  # TEMPORARY: registers the workflow on this branch so it can be dispatched before merge.
  push:
    branches: [backend-matrix]
  workflow_dispatch:
    inputs:
      repository:
        description: "Plugin repository (owner/repo) — recorded in the result"
        required: true
        type: string
      sha:
        description: "Commit the candidate was built from — recorded in the result"
        required: true
        type: string
      jar_url:
        description: "URL of the candidate jar"
        required: true
        type: string
      baseline_jar_url:
        description: "URL of the current stable jar whose data the candidate must load"
        required: true
        type: string
      dependencies:
        description: "Comma-separated owner/repo list whose /releases/latest jar is installed alongside both"
        required: false
        type: string
        default: ""
      expected_version:
        description: "Version the candidate must enable with (optional)"
        required: false
        type: string
        default: ""
      minecraft_version:
        description: "Spigot version to boot"
        required: false
        type: string
        default: "26.2"
      config_overrides:
        description: "Newline-separated `dotted.key: value` lines applied to plugins/<Name>/config.yml after the baseline's first boot (optional)"
        required: false
        type: string
        default: ""
      scenario:
        description: "Newline-separated console commands sent to the baseline after the overrides and a restart (optional)"
        required: false
        type: string
        default: ""
      extra_data_paths:
        description: "Newline-separated server-root-relative glob patterns to capture beyond plugins/<Name>/ (optional)"
        required: false
        type: string
        default: ""
      fixture_url:
        description: "URL of a fixture tar.gz (a plugin-fixtures release asset) to boot the baseline over instead of recording one (optional)"
        required: false
        type: string
        default: ""
      fixture_manifest_url:
        description: "URL of that fixture's manifest.json; defaults to manifest.json beside the archive, as every plugin-fixtures release carries it"
        required: false
        type: string
        default: ""
      restart_cycles:
        description: "Stop/start cycles of the candidate after its first boot (each with the full stop, counts and files-kept checks)"
        required: false
        type: string
        default: "1"
      backend:
        description: "Store the plugin is run on: h2 (embedded default), mariadb or postgres (a database container beside the server), json (the plugin's JSON store, with a migration round trip)"
        required: false
        type: choice
        options: [h2, mariadb, postgres, json]
        default: h2
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      sha:
        required: true
        type: string
      jar_url:
        required: true
        type: string
      baseline_jar_url:
        required: true
        type: string
      dependencies:
        required: false
        type: string
        default: ""
      expected_version:
        required: false
        type: string
        default: ""
      minecraft_version:
        required: false
        type: string
        default: "26.2"
      config_overrides:
        required: false
        type: string
        default: ""
      scenario:
        required: false
        type: string
        default: ""
      extra_data_paths:
        required: false
        type: string
        default: ""
      fixture_url:
        required: false
        type: string
        default: ""
      fixture_manifest_url:
        required: false
        type: string
        default: ""
      restart_cycles:
        required: false
        type: string
        default: "1"
      backend:
        required: false
        type: string
        default: h2

permissions:
  contents: read

concurrency:
  group: save-compat-${{ inputs.repository }}-${{ inputs.sha }}-${{ inputs.backend || 'h2' }}
  cancel-in-progress: false

jobs:
  save-compat:
    if: github.event_name != 'push'
    name: ${{ inputs.repository }} @ ${{ inputs.sha }} (${{ inputs.backend || 'h2' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout gates
        uses: actions/checkout@v4

      - name: Checkout OMCSI
        uses: actions/checkout@v4
        with:
          repository: dmccoystephenson/open-mc-server-infrastructure
          path: omcsi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: pip install requests pyyaml

      - name: Download candidate
        run: |
          set -euo pipefail
          mkdir -p work/candidate
          name=$(basename "${{ inputs.jar_url }}")
          curl -fsSL -o "work/candidate/$name" "${{ inputs.jar_url }}"
          unzip -l "work/candidate/$name" plugin.yml >/dev/null
          echo "CANDIDATE_JAR=$PWD/work/candidate/$name" >> "$GITHUB_ENV"

      # The baseline is the jar operators run today; its data is what the candidate must load.
      - name: Download baseline
        run: |
          set -euo pipefail
          mkdir -p work/baseline
          name=$(basename "${{ inputs.baseline_jar_url }}")
          curl -fsSL -o "work/baseline/$name" "${{ inputs.baseline_jar_url }}"
          unzip -l "work/baseline/$name" plugin.yml >/dev/null
          echo "BASELINE_JAR=$PWD/work/baseline/$name" >> "$GITHUB_ENV"

      # A supplied fixture replaces the recording: the archive and the manifest.json published
      # beside it (the plugin-fixtures convention: every fixture release carries both).
      - name: Download fixture
        if: inputs.fixture_url != ''
        run: |
          set -euo pipefail
          mkdir -p work/fixture-input
          url="${{ inputs.fixture_url }}"
          manifest_url="${{ inputs.fixture_manifest_url }}"
          manifest_url="${manifest_url:-${url%/*}/manifest.json}"
          curl -fsSL -o work/fixture-input/fixture.tar.gz "$url"
          tar tzf work/fixture-input/fixture.tar.gz >/dev/null
          curl -fsSL -o work/fixture-input/manifest.json "$manifest_url"
          python -c 'import json; m = json.load(open("work/fixture-input/manifest.json")); print(m["plugin"], m["version"], m.get("kind", "recorded"), "expected:", m.get("expected"))'
          {
            echo "FIXTURE_ARCHIVE=$PWD/work/fixture-input/fixture.tar.gz"
            echo "FIXTURE_MANIFEST=$PWD/work/fixture-input/manifest.json"
            echo "FIXTURE_URL=$url"
            echo "FIXTURE_MANIFEST_URL=$manifest_url"
          } >> "$GITHUB_ENV"

      # Each dependency is resolved to its current *stable* release — the same
      # /releases/latest endpoint DPM installs from — so the gate boots what an operator gets.
      # `original-*.jar` is the Maven shade plugin's unshaded artifact and is never the plugin.
      - name: Resolve dependencies to stable releases
        if: inputs.dependencies != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/deps
          IFS=',' read -ra repos <<< "${{ inputs.dependencies }}"
          paths=""
          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            [ -z "$repo" ] && continue
            url=$(gh api "repos/$repo/releases/latest" \
              -q '[.assets[] | select(.name | endswith(".jar")) | select(.name | startswith("original-") | not)][0].browser_download_url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::error::$repo has no stable release with a jar asset" >&2
              exit 1
            fi
            name=$(basename "$url")
            curl -fsSL -o "work/deps/$name" "$url"
            echo "$repo -> $name"
            paths="${paths}${PWD}/work/deps/${name}"$'\n'
          done
          {
            echo "DEPENDENCY_JARS<<EOF"
            printf '%s' "$paths"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configure OMCSI environment
        run: |
          {
            echo "MINECRAFT_VERSION=${{ inputs.minecraft_version }}"
            echo "OPERATOR_UUID=00000000-0000-0000-0000-000000000001"
            echo "OPERATOR_NAME=CIRunner"
            echo "OPERATOR_LEVEL=4"
            echo "ONLINE_MODE=false"
            echo "OVERWRITE_EXISTING_SERVER=true"
            echo "SERVER_MOTD=Save-compatibility gate"
            echo "MAX_PLAYERS=5"
            echo "DIFFICULTY=peaceful"
            echo "GAMEMODE=creative"
            echo "PVP_ENABLED=false"
            echo "JAVA_OPTS=-Xmx2G -Xms1G"
            echo "MINECRAFT_AUTO_RESTART=false"
            echo "DEPLOY_AUTH_TOKEN=save-compat-$GITHUB_RUN_ID"
            echo "RCON_PASSWORD=save-compat-$GITHUB_RUN_ID"
            echo "DISCORD_ENABLED=false"
            echo "DISCORD_WEBHOOK_URL="
            echo "ALERT_MANAGER_ENABLED=false"
            echo "AGENT_ENABLED=false"
          } > omsci.env.tmp
          mv omsci.env.tmp omcsi/.env

      - name: Cache OMCSI Docker images
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/omcsi-images.tar
          key: omcsi-docker-${{ inputs.minecraft_version }}-${{ hashFiles('omcsi/**/Dockerfile', 'omcsi/compose.yml') }}
          restore-keys: omcsi-docker-${{ inputs.minecraft_version }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/omcsi-images.tar

      - name: Build OMCSI services
        if: steps.docker-cache.outputs.cache-hit != 'true'
        working-directory: omcsi
        env:
          DOCKER_BUILDKIT: '1'
          BUILDKIT_PROGRESS: plain
        run: docker compose build minecraft-wrapper alert-manager

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save open-mc-server open-mc-server-alert-manager > /tmp/omcsi-images.tar

      - name: Start minecraft-wrapper
        working-directory: omcsi
        run: docker compose up -d ${{ steps.docker-cache.outputs.cache-hit == 'true' && '--no-build' || '' }} minecraft-wrapper

      # A database backend is a container on the server's compose network, up and accepting
      # connections before any plugin jar is deployed, and kept for the whole run: baseline
      # and candidate share one database, so the candidate migrates the very schema the
      # stable release created. The credentials are throwaway — the container lives only
      # inside this job. Torn down with the stack.
      - name: Start database backend
        if: inputs.backend == 'mariadb' || inputs.backend == 'postgres'
        run: |
          set -euo pipefail
          net=$(docker inspect open-mc-server --format '{{range $k, $_ := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | head -n1)
          echo "server network: $net"
          case "${{ inputs.backend }}" in
            mariadb)
              docker run -d --name mfdb --network "$net" \
                -e MARIADB_ROOT_PASSWORD=save-compat-root -e MARIADB_DATABASE=mf \
                -e MARIADB_USER=mf -e MARIADB_PASSWORD=save-compat mariadb:11
              ready() { docker exec mfdb mariadb -umf -psave-compat -h 127.0.0.1 -e 'select 1' mf >/dev/null 2>&1; }
              ;;
            postgres)
              docker run -d --name mfdb --network "$net" \
                -e POSTGRES_USER=mf -e POSTGRES_PASSWORD=save-compat -e POSTGRES_DB=mf postgres:16
              ready() { docker exec mfdb pg_isready -U mf -d mf >/dev/null 2>&1; }
              ;;
          esac
          for i in $(seq 1 60); do
            if ready; then echo "mfdb ready after ${i} poll(s)"; exit 0; fi
            sleep 2
          done
          echo "::error::mfdb (${{ inputs.backend }}) did not accept connections within 120s" >&2
          docker logs mfdb >&2 || true
          exit 1

      - name: Run the save-compatibility gate
        env:
          OMCSI_API_BASE: http://localhost:8092
          OMCSI_DEPLOY_TOKEN: save-compat-${{ github.run_id }}
          REPOSITORY: ${{ inputs.repository }}
          SHA: ${{ inputs.sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          CONFIG_OVERRIDES: ${{ inputs.config_overrides }}
          SCENARIO: ${{ inputs.scenario }}
          EXTRA_DATA_PATHS: ${{ inputs.extra_data_paths }}
          # FIXTURE_ARCHIVE / FIXTURE_MANIFEST / FIXTURE_URL / FIXTURE_MANIFEST_URL come from
          # the Download fixture step's GITHUB_ENV when fixture_url was given.
          RESTART_CYCLES: ${{ inputs.restart_cycles || '1' }}
          BACKEND: ${{ inputs.backend || 'h2' }}
          DB_CONTAINER: mfdb
          DB_HOST: mfdb
          DB_NAME: mf
          DB_USER: mf
          DB_PASSWORD: save-compat
          WORK_DIR: ${{ github.workspace }}/work
          RESULT_PATH: ${{ github.workspace }}/work/result.json
        run: python gates/save_compat.py

      - name: Collect server log
        if: always()
        run: |
          mkdir -p work/evidence
          docker logs open-mc-server > work/evidence/server.log 2>&1 || true
          if docker inspect mfdb >/dev/null 2>&1; then docker logs mfdb > work/evidence/db.log 2>&1 || true; fi

      - name: Summarize
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "work/result.json"
          if not os.path.exists(p):
              print("## Save-compatibility gate — no result written (harness did not run)"); raise SystemExit
          r = json.load(open(p))
          print(f"## Save-compatibility gate — {'PASSED' if r['passed'] else 'FAILED'}")
          print(f"`{r['repository']}` @ `{r['sha']}` — {r['plugin']} v{r.get('baselineVersion')} → v{r.get('version')}; backend: {r.get('backend', 'h2')}; restart cycles: {r.get('restartCycles', 1)}; fixture: {r.get('fixtureFiles')} file(s)\n")
          fx = r.get("fixture")
          if fx:
              print(f"Supplied fixture: {fx.get('plugin')} {fx.get('version')} ({fx.get('kind')}) from {fx.get('url')} — sha256 `{fx.get('sha256')}`\n")
          expected = (fx or {}).get("expected") or {}
          boots = r.get("restartCycles", 1) + 1
          counts = r.get("counts", {})
          if counts or expected:
              labels = list(counts) + [l for l in expected if l not in counts]
              print("| loaded | " + ("manifest expected | " if expected else "") + "baseline | " + " | ".join(f"candidate boot {k}" for k in range(1, boots + 1)) + " |")
              print("|---|" + ("---|" if expected else "") + "---|" + "---|" * boots)
              for label in labels:
                  cols = list(counts.get(label, [])) + [None] * (boots + 1)
                  row = f"| {label} | "
                  if expected:
                      row += f"{'' if label not in expected else expected[label]} | "
                  print(row + " | ".join('' if c is None else str(c) for c in cols[:boots + 1]) + " |")
              print()
          if r.get("migrationRoundtrip"):
              print(f"Migration round trip from `{r['migrationRoundtrip']['start']}`:\n")
              print("| leg | migration | restart on target |\n|---|---|---|")
              for leg in r["migrationRoundtrip"]["legs"]:
                  print(f"| {leg['from']} → {leg['to']} | {leg.get('migration', '')} | {leg.get('countsDetail', '')} |")
              print()
          print("| assertion | result | detail |\n|---|---|---|")
          for a in r["assertions"]:
              print(f"| {a['name']} | {'✅' if a['passed'] else '❌'} | {a['detail']} |")
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-compat-${{ github.run_id }}
          path: |
            work/result.json
            work/evidence/
          if-no-files-found: warn

      - name: Tear down OMCSI stack
        if: always()
        working-directory: omcsi
        run: |
          docker rm -f mfdb >/dev/null 2>&1 || true
          docker compose down
